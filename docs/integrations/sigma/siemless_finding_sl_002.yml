title: 'SIEMless SL-002: Untrusted content followed by sensitive action'
id: f6dc6754-0423-5c72-a427-3c1126798f0c
name: siemless_finding_sl_002
status: experimental
description: Content from outside the trust boundary (a web page, search result, browser page or downloaded
    file) entered the context, and within the window the agent targeted a credential store, reached a
    new destination, changed its own configuration or scheduled a job. The indirect prompt-injection shape.
references:
- https://github.com/ASV-Labs/siemless
author: ASV Labs (SIEMless)
date: '2026-11-08'
logsource:
    product: hermes
    service: siemless
    definition: SIEMless OCSF JSONL; field names are OCSF paths flattened with dots
detection:
    selection:
        class_uid: 2004
        metadata.product.name: SIEMless
        unmapped.siemless.rule_id: SL-002
    condition: selection
falsepositives:
- Research tasks that fetch docs and then edit config on purpose. The finding is medium when the downstream
    action is only a new destination, high when it is credential access or a governance change.
level: high
tags:
