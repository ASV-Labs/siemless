title: 'SIEMless SL-005: Scheduled job or persistence created'
id: 0153bc43-8413-5dee-a27f-ed1aa927c599
name: siemless_finding_sl_005
status: experimental
description: A Hermes cron job was created or changed, or a shell command installed OS-level persistence
    (crontab, launchctl, systemd, schtasks).
references:
- https://github.com/ASV-Labs/siemless
author: ASV Labs (SIEMless)
date: '2026-11-08'
logsource:
    product: hermes
    service: siemless
    definition: SIEMless OCSF JSONL; field names are OCSF paths flattened with dots
detection:
    selection:
        class_uid: 2004
        metadata.product.name: SIEMless
        unmapped.siemless.rule_id: SL-005
    condition: selection
falsepositives:
- Users ask for scheduled jobs. The finding is low when the user turn is the direct parent; high when
    the session was tainted.
level: medium
tags:
- attack.t1053
- attack.execution
